<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Queen Etus · Annual Dashboard</title>

<!--
================================================================================
  QUEEN ETUS - ANNUAL DASHBOARD
  Built to match the Stan20201 Annual Dashboard tab.
  Single file, no build step, no external scripts. Every chart is hand-drawn SVG.
================================================================================

  STRUCTURE - how Stan20201 maps onto Queen Etus
  ----------------------------------------------
  Stan20201 runs four pillars: INCOME, EXPENSES, DEBT PAYOFF, SAVINGS.
  Queen has no debt or savings tracking, so the four pillars become:

      INCOME    green   money in from jobs and sales
      EXPENSES  pink    materials, fuel, plants, overhead
      PAYROLL   purple  what the workers were paid
      PROFIT    gold    what is actually left

  Every section keeps the Stan20201 anatomy: category table, overview card with
  the big statement number, breakdown column chart with a dashed budget line,
  split rail, month chart, percentage donut, and an averages rail.

  COLOURS - lifted from the Stan20201 tab
  ---------------------------------------
  All six live in :root below. Change them in one place.

  BUDGETS
  -------
  Stan20201 is budget-driven. Queen is actuals-only for now, so budgets live in
  CONFIG.BUDGET. Fill them in and every Goal column, dashed line and
  "over / under budget" statement switches on. Leave them empty and the
  dashboard drops those elements and shows share-of-total instead.

  LIVE DATA - already switched on
  -------------------------------
  MODE is 'csv'. The sheet is shared as "Anyone with the link can view", so
  nothing has to be published to the web: the dashboard reads it directly.
  Tabs are addressed by NAME, not gid, so a recreated tab keeps working.

  Must be served over https from real hosting (GitHub Pages, Netlify). Opening
  the file straight off your disk, or inside a chat preview sandbox, blocks the
  request to docs.google.com and the dashboard falls back to sample data.

  COLUMN POSITIONS - read off the live sheet, not assumed
  -------------------------------------------------------
    Flower Girls / Concrete Workz / STS   C Date  D Desc  E Job  F Catgeory  G Amount  H Photo Link
    Personal Expenses                     C Date  D Desc         E Catgeory  F Amount  G Photo Link

  The Date and Amount headers are blank in the sheet, so the loader finds
  Category and Description by name and positions the rest off them. The header
  row is found by searching, not hard-coded, so inserting a row will not break it.
  "Catgeory" is misspelled in the sheet. The matcher accepts both spellings.
  Dates read as Jan-02-2026, which the browser cannot parse on its own, so the
  loader parses that shape explicitly.

  RECEIPT PHOTOS
  --------------
  The Photo Link cell may hold a Drive share link, an open?id= link, a bare
  Drive file id, or any direct image URL. All four become a thumbnail.
  Click any thumbnail to open it full size.

  Two things that will NOT work:
    - An image added with Insert > Image in cell. That is not a cell value, so
      no CSV reader can see it. The cell must contain a LINK.
    - =HYPERLINK("url","Receipt"). CSV returns the label, not the address.
      Paste the plain URL, or use =HYPERLINK(url) with no second argument.
  Receipt files must also be shared as "Anyone with the link can view", or the
  thumbnail will 404 and the cell shows a warning marker.

================================================================================
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  /* ---- Stan20201 palette ---- */
  --bg:#0F1824;
  --panel:#18222F;
  --panel2:#212C3B;
  --line:rgba(255,255,255,.07);
  --ink:#FFFFFF;
  --mute:#8B98A9;
  --faint:#56657A;

  --green:#3FDD9C;
  --pink:#FF4D6D;
  --purple:#7C6CF6;
  --gold:#F4C542;

  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--ink);
  font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:400;font-size:14.5px;-webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
.wrap{max-width:1620px;margin:0 auto;padding:0 20px}

/* ---------------- top bar ---------------- */
.top{position:sticky;top:0;z-index:50;background:rgba(15,24,36,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:20px;height:64px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.2px}
.brand em{color:var(--mute);font-style:normal;font-weight:300;font-size:13px;margin-left:8px}
.views{display:flex;gap:3px;background:var(--panel);padding:3px;border-radius:9px}
.views button{background:none;border:0;color:var(--mute);font:500 13.5px Poppins,sans-serif;padding:7px 16px;border-radius:7px;cursor:pointer}
.views button[aria-selected="true"]{background:var(--panel2);color:var(--ink)}
.views button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.sp{flex:1}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:400 13.5px Poppins,sans-serif;cursor:pointer}
select:focus-visible{outline:2px solid var(--green);outline-offset:1px}

/* ---------------- title + KPI row ---------------- */
.hero{display:grid;grid-template-columns:1.15fr repeat(4,1fr);gap:12px;margin:18px 0 10px}
.titlecard{background:var(--panel);border-radius:var(--r);display:flex;align-items:center;padding:26px 28px}
.titlecard h1{margin:0;font-size:34px;font-weight:700;line-height:1.14;letter-spacing:-.8px}
.titlecard h1 small{display:block;font-size:13px;font-weight:300;color:var(--mute);letter-spacing:0;margin-top:9px}

.kpi{background:var(--panel);border-radius:var(--r);padding:15px 16px 0;display:flex;flex-direction:column;overflow:hidden;min-height:152px}
.kpi .v{font-size:29px;font-weight:700;letter-spacing:-.7px;line-height:1.1}
.kpi .l{font-size:12px;color:var(--mute);margin-top:2px}
.kpi .meta{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);margin-top:9px}
.kpi .spark{margin:8px -16px 0;line-height:0}
.pbar{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;border-radius:3px}

/* ---------------- sections ---------------- */
.sec{margin-top:26px}
.sec h2{
  margin:0 0 12px;font-size:18px;font-weight:700;letter-spacing:.9px;color:var(--c);
}
.rowA{display:grid;grid-template-columns:1.45fr 1fr 2.5fr 1fr;gap:12px}
.rowB{display:grid;grid-template-columns:2.45fr 2fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--panel);border-radius:var(--r);padding:13px 15px;min-width:0}
.card h3{margin:0 0 11px;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:.2px}

/* category table */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--mute);font-weight:400;font-size:11px;padding:0 6px 8px 0;border-bottom:1px solid var(--line)}
td{padding:7px 6px 7px 0;font-variant-numeric:tabular-nums;white-space:nowrap}
th.n,td.n{text-align:right}
.dot{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:7px;vertical-align:1px}
.tname{max-width:160px;overflow:hidden;text-overflow:ellipsis}
.scroll{max-height:300px;overflow:auto}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:3px}

/* overview card */
.ov{display:flex;flex-direction:column;height:100%}
.ovtop{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
.ovtop b{display:block;font-size:20px;font-weight:600;color:var(--ink);margin-top:3px;letter-spacing:-.4px}
.ovbig{background:var(--panel2);border-radius:8px;padding:16px 14px;text-align:center;margin-top:auto}
.ovbig .n{font-size:28px;font-weight:700;color:var(--c);letter-spacing:-.8px;line-height:1.1}
.ovbig .t{font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.45}

/* split rail */
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:11.5px;color:var(--mute)}
.split b{display:block;font-size:17.5px;font-weight:600;color:var(--ink);margin-top:3px;letter-spacing:-.3px}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;text-align:center}
.gauges small{display:block;font-size:11px;color:var(--mute);margin-top:2px}

/* stats rail */
.stat{border-top:1px solid var(--line);padding:11px 0}
.stat:first-child{border-top:0;padding-top:0}
.stat .k{font-size:11px;color:var(--mute)}
.stat .r{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.stat .r span{font-size:13px;color:var(--mute)}
.stat .r b{font-size:16px;font-weight:600;letter-spacing:-.3px}

svg{display:block;width:100%;height:auto}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mute);margin-bottom:6px;justify-content:flex-end}
.lg i{display:inline-block;width:8px;height:2px;background:currentColor;vertical-align:3px;margin-right:4px}

.note{margin-top:22px;padding:13px 16px;border-left:2px solid var(--c,var(--gold));background:rgba(255,255,255,.03);border-radius:0 8px 8px 0;font-size:13px;color:var(--mute);line-height:1.65;font-weight:300}
/* receipt thumbnails */
.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--panel2);
  border:1px solid var(--line);cursor:zoom-in;display:block}
.thumb:hover{border-color:var(--pink)}
.nothumb{width:40px;height:40px;border-radius:6px;background:var(--panel2);display:flex;
  align-items:center;justify-content:center;color:var(--faint);font-size:15px}
td.th{width:52px;padding-right:12px}
#lb{position:fixed;inset:0;background:rgba(6,14,22,.93);z-index:200;display:none;
  align-items:center;justify-content:center;padding:28px;cursor:zoom-out;backdrop-filter:blur(3px)}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:84vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#lb .cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:var(--mute);font-size:13px}
#lb .x{position:absolute;top:18px;right:24px;color:var(--mute);font-size:26px;line-height:1}
.hide{display:none!important}
.empty{color:var(--faint);font-size:12.5px;text-align:center;padding:26px 0}

@media (max-width:1500px){
  .hero{grid-template-columns:repeat(4,1fr)}
  .titlecard{grid-column:1/-1;padding:18px 24px}
  .titlecard h1{font-size:26px}
  .rowA{grid-template-columns:1.3fr 1fr;grid-auto-rows:auto}
  .rowA>*:nth-child(3){grid-column:1/-1}
  .rowB{grid-template-columns:1fr 1fr}
  .rowB>*:nth-child(3){grid-column:1/-1}
}
@media (max-width:820px){
  .wrap{padding:0 12px}
  .hero,.rowA,.rowB{grid-template-columns:1fr}
  .rowA>*,.rowB>*{grid-column:auto!important}
  .topin{height:auto;padding:10px 0;flex-wrap:wrap;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const CONFIG = {
  // 'csv'  = live from the sheet (default - the sheet is link-readable, so
  //          nothing needs publishing).
  // 'demo' = built-in sample data, for showing the layout with no network.
  MODE: 'csv',
  SHEET_ID: '1IqtrMsvETtWjYCSIjGqObdJUvNoM5_uVMucGBwqcw5I',

  // Tabs are addressed by NAME, not gid. Names survive a tab being recreated;
  // gids do not. Rename a tab in the sheet and you change it here too.
  SOURCES: {
    incomeJobs:  { sheet:'JOBS/INCOME',                kind:'income'                                 },
    expFlower:   { sheet:'Flower Girls Expenses',      kind:'expense', business:'Flower Girlz'       },
    expConcrete: { sheet:'Concrete Workz Expenses',    kind:'expense', business:'Concrete Workz'     },
    expSts:      { sheet:'STS Group / Friendly Barks', kind:'expense', business:'STS Group'          },
    expPersonal: { sheet:'Personal Expenses',          kind:'expense', business:'Personal'           },
    payFlower:   { sheet:'Payroll- Flower Girls',      kind:'payroll', business:'Flower Girlz'       },
    payConcrete: { sheet:'Payroll- Concrete Workz',    kind:'payroll', business:'Concrete Workz'     }
  },

  // Width in pixels requested from Google for receipt thumbnails.
  THUMB_W: 320,

  // Annual budget per pillar. Set to 0 to switch budget comparison off.
  BUDGET: { income:0, expenses:0, payroll:0 },

  // Expense categories that are direct job cost. Everything else counts as
  // overhead. This drives the Direct / Overhead split, the same way
  // Stan20201 splits Need / Want.
  DIRECT_COST: ['plants','soil','mulch','pots','cement','rebar','gravel',
                'forms','material','materials','supplies','concrete','sand'],

  BIZ_COLORS: { 'Flower Girlz':'#3FDD9C', 'Concrete Workz':'#7C6CF6',
                'STS Group':'#4FC3F7', 'Personal':'#F4C542' }
};
</script>

<header class="top"><div class="wrap topin">

  <div class="views" role="tablist">

    <button id="tabPer" role="tab" aria-selected="false">Personal</button>

<div id="lb" role="dialog" aria-label="Receipt photo" aria-modal="true">

  <img id="lbImg" alt="Receipt photo" />
  <div class="cap" id="lbCap"></div>

<main id="viewBiz" class="wrap"></main>

<script>
(function(){
'use strict';

const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = id => document.getElementById(id);
const CSS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ======================= formatting ======================= */
const money = n => (n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const compact = n => {
  const a=Math.abs(n);
  if(a>=1e6) return (n<0?'-':'')+'$'+(a/1e6).toFixed(1)+'M';
  if(a>=1e4) return (n<0?'-':'')+'$'+Math.round(a/1e3)+'k';
  if(a>=1e3) return (n<0?'-':'')+'$'+(a/1e3).toFixed(1)+'k';
  return money(n);
};
const pc = (a,b) => b ? Math.round(a/b*100)+'%' : '0%';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* One receipt cell. Falls back to a dash when the Photo Link cell is empty,
   and to the same dash when the image itself fails to load (a Drive file that
   is not shared will 404). */
function thumbCell(r){
  const u=photoUrl(r.photo);
  if(!u) return '<td class="th"><div class="nothumb" title="No receipt photo">&ndash;</div></td>';
  const cap=esc((r.desc||r.category||'')+'  '+money(r.amount));
  return '<td class="th"><img class="thumb" loading="lazy" src="'+esc(u)+
    '" alt="Receipt" data-cap="'+cap+'" '+
    'onerror="this.outerHTML=\'<div class=&quot;nothumb&quot; title=&quot;Photo link is set but the file is not shared&quot;>!</div>\'"></td>';
}

/* Lightbox: click any thumbnail to see it full size. */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t && t.classList && t.classList.contains('thumb')){
    $('lbImg').src=t.src.replace(/sz=w\d+/,'sz=w1600');
    $('lbCap').textContent=t.dataset.cap||'';
    $('lb').classList.add('on');
  } else if(t && (t.id==='lb'||t.classList.contains('x'))){
    $('lb').classList.remove('on'); $('lbImg').src='';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ $('lb').classList.remove('on'); $('lbImg').src=''; }
});

/* ======================= SVG chart kit ======================= */

/* area sparkline for the KPI tiles */
/* KPI sparkline. Carries a month axis underneath, with the highest month
   marked in the series colour and the lowest month marked hollow, so the
   shape can be read without hovering. Note this no longer stretches: it
   scales uniformly, or the month names would come out distorted. */
function chSpark(v,color,ch){
  const W=240, CH=ch||46, LB=19, H=CH+LB;
  const max=Math.max(...v), min=Math.min(...v), span=(max-min)||1;
  const x=i=>i/(v.length-1||1)*W;
  const y=d=>CH-6-((d-min)/span)*(CH-14);
  const hi=v.indexOf(max), lo=v.indexOf(min);
  const line=v.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d).toFixed(1)).join(' ');
  const id='sp'+Math.random().toString(36).slice(2,8);

  let g='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="'+color+'" stop-opacity=".40"/>'+
    '<stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+line+' L'+W+' '+CH+' L0 '+CH+' Z" fill="url(#'+id+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.8"/>';

  /* peak filled, trough hollow */
  if(v.length>1){
    g+='<circle cx="'+x(hi).toFixed(1)+'" cy="'+y(v[hi]).toFixed(1)+'" r="3.2" fill="'+color+'"/>'+
       '<circle cx="'+x(lo).toFixed(1)+'" cy="'+y(v[lo]).toFixed(1)+'" r="2.8" fill="'+CSS('--panel')+
       '" stroke="'+color+'" stroke-width="1.5" opacity=".75"/>';
  }

  /* month axis. The first and last labels anchor inward so they stay inside
     the card, since the chart itself bleeds to both edges. */
  v.forEach((d,i)=>{
    const last=i===v.length-1;
    const anchor=i===0?'start':(last?'end':'middle');
    const tx=i===0?2:(last?W-2:x(i));
    const isHi=i===hi, isLo=i===lo;
    g+='<text x="'+tx.toFixed(1)+'" y="'+(H-5)+'" text-anchor="'+anchor+'" font-size="9.5"'+
       (isHi?' font-weight="600"':'')+' fill="'+
       (isHi?color:(isLo?CSS('--mute'):CSS('--faint')))+'">'+(M[i]||(i+1))+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+g+'</svg>';
}

/* column chart with value labels and an optional dashed budget line */
function chColumns(vals,labels,color,budget,opt){
  opt=opt||{};
  const W=620,H=opt.h||252,L=72,R=10,T=28,B=opt.rot?84:38;
  const iw=W-L-R, ih=H-T-B;
  const all=vals.concat(budget||[]);
  const max=Math.max(1,...all.map(Math.abs));
  const hasNeg=Math.min(...vals)<0;
  const zero=hasNeg?T+ih/2:T+ih;
  const unit=hasNeg?(ih/2)/max:ih/max;
  const bw=iw/vals.length;
  let g='';

  /* y grid */
  const ticks=hasNeg?[-max,-max/2,0,max/2,max]:[0,max/4,max/2,max*0.75,max];
  ticks.forEach(t=>{
    const y=zero-t*unit;
    g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+
       '" stroke="'+CSS('--line')+'" stroke-width="1"/>'+
       '<text x="'+(L-10)+'" y="'+(y+4.5).toFixed(1)+'" text-anchor="end" fill="'+CSS('--faint')+
       '" font-size="13">'+compact(t)+'</text>';
  });

  vals.forEach((d,i)=>{
    const w=bw*0.58, x=L+i*bw+(bw-w)/2;
    const hh=Math.max(1.5,Math.abs(d)*unit);
    const y=d>=0?zero-hh:zero;
    const col=(hasNeg&&d<0)?CSS('--pink'):color;
    g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hh.toFixed(1)+
       '" rx="2" fill="'+col+'"><title>'+esc(labels[i])+': '+money(d)+'</title></rect>';
    if(opt.values!==false && d)
      g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(d>=0?y-6:y+hh+13).toFixed(1)+
         '" text-anchor="middle" fill="'+CSS('--mute')+'" font-size="12">'+compact(d)+'</text>';
    const lx=(x+w/2).toFixed(1), ly=(H-B+18);
    /* Rotated labels run down-left, so a long one spills past the bottom of the
       chart. Clip it; the bar's tooltip still carries the full name. */
    const lab=(opt.rot&&String(labels[i]).length>14)?String(labels[i]).slice(0,13)+'\u2026':labels[i];
    g+= opt.rot
      ? '<text x="'+lx+'" y="'+ly+'" fill="'+CSS('--faint')+'" font-size="12.5" text-anchor="end" transform="rotate(-40 '+lx+' '+ly+')">'+esc(lab)+'</text>'
      : '<text x="'+lx+'" y="'+ly+'" text-anchor="middle" fill="'+CSS('--faint')+'" font-size="13">'+esc(lab)+'</text>';
  });

  if(budget && budget.some(Boolean)){
    const pts=budget.map((d,i)=>(L+i*bw+bw/2).toFixed(1)+','+(zero-d*unit).toFixed(1)).join(' ');
    g+='<polyline points="'+pts+'" fill="none" stroke="'+CSS('--mute')+
       '" stroke-width="1.3" stroke-dasharray="5 4"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
}

/* line + area across the top, labelled mini bars underneath */
function chCombo(vals,labels,color,budget){
  const W=620,H=280,L=72,R=10,T=20;
  const aH=122, bTop=T+aH+40, bH=54;
  const iw=W-L-R;
  const max=Math.max(1,...vals,...(budget||[]));
  const x=i=>L+(vals.length>1?i/(vals.length-1)*iw:iw/2);
  const y=d=>T+aH-(d/max)*aH;
  let g='';

  [0,.25,.5,.75,1].forEach(f=>{
    const yy=T+aH-f*aH;
    g+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="'+CSS('--line')+'"/>'+
       '<text x="'+(L-10)+'" y="'+(yy+4.5)+'" text-anchor="end" fill="'+CSS('--faint')+'" font-size="13">'+
       compact(max*f)+'</text>';
  });

  const line=vals.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d).toFixed(1)).join(' ');

/* ======================= data loading ======================= */
function parseCSV(t){
  const rows=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if(ch==='"')q=true;
    else if(ch===','){row.push(c);c='';}
    else if(ch==='\n'){row.push(c);rows.push(row);row=[];c='';}
    else if(ch!=='\r')c+=ch;
  }
  if(c.length||row.length){row.push(c);rows.push(row);}
  return rows;
}
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0;};

/* The sheet writes dates as Jan-02-2026, which the browser's own Date()
   does not parse. Handle that shape first, then fall back. */
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function date(v){
  if(v instanceof Date) return isNaN(v)?null:v;
  const t=String(v==null?'':v).trim(); if(!t) return null;
  let m=t.match(/^([A-Za-z]{3})[-\s](\d{1,2})[-\s](\d{4})$/);
  if(m && MON[m[1].toLowerCase()]!==undefined) return new Date(+m[3],MON[m[1].toLowerCase()],+m[2]);
  m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);        if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[1]-1,+m[2]); }
  const d=new Date(t); return isNaN(d)?null:d;
}

/* Turn whatever is in the Photo Link cell into an image URL.
   Accepts a Drive share link, an open?id= link, a bare file id, a
   googleusercontent link, or any direct image URL. */
function photoUrl(v,w){
  const t=String(v==null?'':v).trim(); if(!t) return '';
  if(/^data:image\//.test(t)) return t;
  const m = t.match(/drive\.google\.com\/file\/d\/([-\w]{20,})/)
         || t.match(/[?&]id=([-\w]{20,})/)
         || t.match(/googleusercontent\.com\/d\/([-\w]{20,})/)
         || (/^[-\w]{25,}$/.test(t) ? [null,t] : null);
  if(m) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w'+(w||CONFIG.THUMB_W);
  return /^https?:\/\//.test(t) ? t : '';
}

/* Column positions are worked out from the header row rather than hard-coded,
   because the four expense tabs do not agree with each other:

     Flower Girls / Concrete Workz / STS   C Date  D Desc  E Job  F Catgeory  G Amount  H Photo Link
     Personal Expenses                     C Date  D Desc         E Catgeory  F Amount  G Photo Link

   The Date and Amount headers are both BLANK in the sheet, so neither can be
   found by name. Category and Description can be, and everything else is
   positioned off them. */
function mapExpense(head){
  const low=head.map(v=>String(v||'').toLowerCase().replace(/[^a-z0-9/# ]/g,'').trim());
  const cat =low.findIndex(v=>/^(catgeory|category|class)/.test(v));
  const desc=low.findIndex(v=>/^description/.test(v));
  let photo =low.findIndex(v=>/photo/.test(v));
  if(cat<0||desc<0) return null;
  const job = (cat-desc>1) ? desc+1 : -1;        // Personal has no Job column
  if(photo<0) photo=cat+2;
  return {date:desc-1, desc:desc, job:job, category:cat, amount:cat+1, photo:photo};
}
function mapPayroll(head){
  const low=head.map(v=>String(v||'').toLowerCase().replace(/[^a-z0-9/# ]/g,'').trim());
  const w=low.findIndex(v=>/^worker/.test(v)); if(w<0) return null;
  return {date:w-1, worker:w, hours:w+1, amount:w+2, job:w+3};
}
/* JOBS/INCOME carries TWO side-by-side blocks:
     C:F  ALL JOBS  (Date, Job / Sales, Job/ Sale Description, Business) - no amounts
     J:N  INCOME    (Date, Job Name / Sale, Business, Amount, Notes)
   Both have a column headed "Business", and column A holds the words
   "BUSINESS CONTROL PANEL", so anchoring on "business" lands in the wrong
   place. "Job Name / Sale" appears once, in the income block, so anchor there. */
function mapIncome(head){
  const low=head.map(v=>String(v||'').toLowerCase().replace(/[^a-z0-9/# ]/g,'').trim());
  const j=low.findIndex(v=>/^job name/.test(v)); if(j<1) return null;
  return {date:j-1, job:j, business:j+1, amount:j+2, notes:j+3};
}
/* Find the header row by looking for the row that actually names a column,
   instead of trusting a fixed row number that an inserted row would break. */
function findHead(rows,re){
  for(let i=0;i<Math.min(rows.length,30);i++)
    if(rows[i].some(v=>re.test(String(v||'')))) return i;
  return -1;
}

async function loadSrc(key){
  const s=CONFIG.SOURCES[key]; if(!s) return [];
  const url='https://docs.google.com/spreadsheets/d/'+CONFIG.SHEET_ID+
    '/gviz/tq?tqx=out:csv&headers=0&sheet='+encodeURIComponent(s.sheet);
  let r; try{ r=await fetch(url); }catch(e){ throw new Error(s.sheet+' could not be reached.'); }
  if(!r.ok) throw new Error(s.sheet+' did not load (HTTP '+r.status+').');
  const rows=parseCSV(await r.text());

  if(s.kind==='expense'){
    const h=findHead(rows,/catgeory|category/i); if(h<0) throw new Error(s.sheet+': no header row found.');
    const ix=mapExpense(rows[h]);                if(!ix) throw new Error(s.sheet+': columns not recognised.');
    return rows.slice(h+1).map(x=>({
      date:date(x[ix.date]), desc:(x[ix.desc]||'').trim(),
      job:ix.job>=0?(x[ix.job]||'').trim():'',
      category:(x[ix.category]||'').trim()||'Uncategorised',
      amount:num(x[ix.amount]), photo:(x[ix.photo]||'').trim(),
      worker:'', hours:0, business:s.business
    })).filter(x=>x.date&&x.amount);
  }
  if(s.kind==='payroll'){
    const h=findHead(rows,/worker/i); if(h<0) throw new Error(s.sheet+': no header row found.');
    const ix=mapPayroll(rows[h]);
    return rows.slice(h+1).map(x=>({
      date:date(x[ix.date]), worker:(x[ix.worker]||'').trim(),
      hours:num(x[ix.hours]), amount:num(x[ix.amount]),
      job:(x[ix.job]||'').trim(), desc:'', category:(x[ix.worker]||'').trim(),
      photo:'', business:s.business
    })).filter(x=>x.date&&x.worker&&x.amount);
  }
  /* income */
  const h=findHead(rows,/job name/i); if(h<0) throw new Error(s.sheet+': no header row found.');
  const ix=mapIncome(rows[h]); if(!ix) throw new Error(s.sheet+': income block not recognised.');
  const NAME={'flower girls':'Flower Girlz','flowergirlz':'Flower Girlz','flower girlz':'Flower Girlz',
              'concrete workz':'Concrete Workz','concrete works':'Concrete Workz',
              'sts group':'STS Group','friendly barks':'STS Group'};
  return rows.slice(h+1).map(x=>{
    const raw=(x[ix.business]||'').trim();
    return { date:date(x[ix.date]), job:(x[ix.job]||'').trim(),
      business:NAME[raw.toLowerCase()]||raw, amount:num(x[ix.amount]),
      desc:(x[ix.notes]||'').trim(), category:'Jobs', worker:'', hours:0, photo:'' };
  }).filter(x=>x.date&&x.amount&&x.business);
}

/* ======================= state + aggregation ======================= */
let DATA={income:[],expenses:[],payroll:[]}, year=2026, bizF='All';
const inY=r=>r.date&&r.date.getFullYear()===year;
const inB=r=>bizF==='All'?r.business!=='Personal':r.business===bizF;
const sum=a=>a.reduce((t,r)=>t+r.amount,0);
function slice(){return{
  income:DATA.income.filter(r=>inY(r)&&inB(r)),
  expenses:DATA.expenses.filter(r=>inY(r)&&inB(r)),
  payroll:DATA.payroll.filter(r=>inY(r)&&inB(r))};}
function perMonth(rows){const a=new Array(12).fill(0);rows.forEach(r=>a[r.date.getMonth()]+=r.amount);return a;}
function group(rows,k){const m=new Map();
  rows.forEach(r=>{const key=r[k]||'Uncategorised';m.set(key,(m.get(key)||0)+r.amount);});
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);}
const isDirect=c=>CONFIG.DIRECT_COST.some(d=>String(c).toLowerCase().includes(d));

/* ======================= section builder ======================= */
/*  Every pillar renders the same Stan20201 anatomy.  */
function section(o){
  const total=o.rows.length?sum(o.rows):0;
  const months=perMonth(o.rows);
  const cats=group(o.rows,o.groupBy);
  const colorOf=o.colorOf||(()=>o.color);
  const budget=o.budget||0;
  const bMonths=budget?new Array(12).fill(budget/12):null;
  const live=months.filter(v=>v>0).length||1;
  const hi=months.indexOf(Math.max(...months));
  const lo=months.map((v,i)=>[v,i]).filter(x=>x[0]>0).sort((a,b)=>a[0]-b[0])[0];

  /* table */
  const tbl=cats.length?cats.map(([n,v])=>
    '<tr><td class="tname"><span class="dot" style="background:'+colorOf(n)+'"></span>'+esc(n)+'</td>'+
    (budget?'<td class="n" style="color:var(--mute)">'+compact(budget*(v/(total||1)))+'</td>':'')+
    '<td class="n">'+money(v)+'</td><td class="n" style="color:'+o.color+'">'+pc(v,total)+'</td></tr>'
  ).join(''):'<tr><td class="empty" colspan="4">Nothing recorded</td></tr>';

  /* overview statement */
  const diff=budget?total-budget:0;
  const statement=budget
    ? '<div class="n">'+money(Math.abs(diff))+'</div><div class="t">'+
      (diff>=0?'over':'under')+' budget this year</div>'
    : '<div class="n">'+money(total/live)+'</div><div class="t">average across '+live+' active months</div>';

  /* split: direct vs overhead for expenses, else top item vs rest */
  let sA,sB,lA,lB;
  if(o.split==='direct'){
    lA='Direct job cost'; lB='Overhead';
    sA=sum(o.rows.filter(r=>isDirect(r.category))); sB=total-sA;
  } else {
    lA=cats.length?cats[0][0]:'Top'; lB='Everything else';
    sA=cats.length?cats[0][1]:0; sB=total-sA;
  }

  const top=cats.slice(0,9);

  const donutPairs=rest>0?[...top,['Other',rest]]:top;
  const donutColor=n=>n==='Other'?CSS('--panel2'):colorOf(n);

  return '<section class="sec" style="--c:'+o.color+'"><h2>'+o.title+'</h2>'+

  '<div class="rowA">'+
    '<div class="card"><h3>'+o.tableTitle+'</h3><div class="scroll"><table><thead><tr>'+
      '<th>'+o.tableCol+'</th>'+(budget?'<th class="n">Goal</th>':'')+
      '<th class="n">Actual</th><th class="n">Share</th></tr></thead><tbody>'+tbl+'</tbody></table></div></div>'+

    '<div class="card ov"><h3>Annual '+o.short+' overview</h3>'+
      '<div class="ovtop"><div>'+(budget?'Budget':'Entries')+'<b>'+(budget?compact(budget):o.rows.length)+'</b></div>'+
      '<div style="text-align:right">Actual<b style="color:'+o.color+'">'+compact(total)+'</b></div></div>'+
      pbar(budget?total/budget:1,o.color)+
      '<div style="font-size:10.5px;color:var(--mute);margin-top:4px">'+(budget?pc(total,budget):'100%')+'</div>'+
      '<div class="ovbig">'+statement+'</div></div>'+

    '<div class="card"><h3>Annual '+o.short.toLowerCase()+' breakdown by '+o.byLabel+'</h3>'+
      (budget?'<div class="lg"><span style="color:'+o.color+'"><i></i>Actual</span><span><i style="background:var(--mute)"></i>Budget</span></div>':'')+
      (cats.length?chColumns(cats.slice(0,12).map(c=>c[1]),cats.slice(0,12).map(c=>c[0]),o.color,
        budget?cats.slice(0,12).map(()=>budget/Math.max(1,cats.length)):null,{rot:true,h:305})
       :'<div class="empty">Nothing recorded</div>')+'</div>'+

    '<div class="card"><h3>'+(o.split==='direct'?'Direct vs overhead':'Concentration')+'</h3>'+
      '<div class="split"><div>'+esc(lA.length>16?lA.slice(0,15)+'…':lA)+'<b>'+compact(sA)+'</b></div>'+
      '<div style="text-align:right">'+lB+'<b>'+compact(sB)+'</b></div></div>'+
      '<div class="gauges"><div>'+gauge(total?sA/total:0,o.color)+'<small>'+esc(lA.length>12?lA.slice(0,11)+'…':lA)+'</small></div>'+
      '<div>'+gauge(total?sB/total:0,CSS('--mute'))+'<small>'+lB+'</small></div></div>'+
      '<div style="margin-top:10px">'+chMini(months,o.color)+'</div></div>'+
  '</div>'+

  '<div class="rowB">'+
    '<div class="card"><h3>'+o.short+' by month</h3>'+
      (budget?'<div class="lg"><span style="color:'+o.color+'"><i></i>Actual</span><span><i style="background:var(--mute)"></i>Budget</span></div>':'')+
      chCombo(months,M,o.color,bMonths)+'</div>'+

    '<div class="card"><h3>Annual '+o.short.toLowerCase()+' breakdown by %</h3>'+
      (donutPairs.length?chDonut(donutPairs,donutColor,292):'<div class="empty">Nothing recorded</div>')+'</div>'+

    '<div class="card">'+
      '<div class="stat"><div class="k">Average monthly '+o.short.toLowerCase()+'</div><div class="r">'+
        '<span>'+(budget?'Goal':'Per month')+'</span><b>'+money(budget?budget/12:total/live)+'</b></div>'+
        (budget?'<div class="r"><span>Actual</span><b style="color:'+o.color+'">'+money(total/live)+'</b></div>':'')+'</div>'+
      '<div class="stat"><div class="k">Highest month</div><div class="r"><span>'+M[hi]+
        '</span><b style="color:'+o.color+'">'+money(months[hi])+'</b></div></div>'+
      '<div class="stat"><div class="k">Lowest active month</div><div class="r"><span>'+
        (lo?M[lo[1]]:'—')+'</span><b>'+(lo?money(lo[0]):'—')+'</b></div></div>'+
      '<div class="stat"><div class="k">Largest single line</div><div class="r"><span>'+
        (cats.length?esc(cats[0][0].slice(0,15)):'—')+'</span><b>'+(cats.length?money(cats[0][1]):'—')+'</b></div></div>'+
      '<div class="stat"><div class="k">'+o.tableCol+'s tracked</div><div class="r"><span>'+
        o.rows.length+' entries</span><b>'+cats.length+'</b></div></div>'+
    '</div>'+
  '</div></section>';
}

/* ======================= business view ======================= */
function renderBiz(){
  const d=slice();
  const inc=perMonth(d.income), exp=perMonth(d.expenses), pay=perMonth(d.payroll);
  const out=exp.map((v,i)=>v+pay[i]);
  const prof=inc.map((v,i)=>v-out[i]);
  const tIn=sum(d.income), tExp=sum(d.expenses), tPay=sum(d.payroll);
  const tOut=tExp+tPay, net=tIn-tOut;
  const B=CONFIG.BUDGET;
  const bizColor=n=>CONFIG.BIZ_COLORS[n]||CSS('--purple');

  const kpi=(v,l,color,series,goal,note)=>
    '<div class="kpi"><div class="v" style="color:'+color+'">'+money(v)+'</div>'+
    '<div class="l">'+l+'</div>'+pbar(goal?v/goal:1,color)+
    '<div class="meta"><span>'+(goal?pc(v,goal):'')+'</span><span>'+note+'</span></div>'+
    '<div class="spark">'+chSpark(series,color)+'</div></div>';

  $('viewBiz').innerHTML=
    '<div class="hero">'+
      '<div class="titlecard"><h1>Annual<br>Dashboard<small>'+year+' · '+
        (bizF==='All'?'All businesses':esc(bizF))+'</small></h1></div>'+
      kpi(tIn,'Total income',CSS('--green'),inc,B.income,B.income?money(Math.abs(tIn-B.income))+(tIn>=B.income?' over goal':' under goal'):'money in')+
      kpi(tExp,'Total expenses',CSS('--pink'),exp,B.expenses,B.expenses?money(Math.abs(tExp-B.expenses))+(tExp>=B.expenses?' over budget':' under budget'):pc(tExp,tOut)+' of spend')+
      kpi(tPay,'Total payroll',CSS('--purple'),pay,B.payroll,B.payroll?money(Math.abs(tPay-B.payroll))+(tPay>=B.payroll?' over budget':' under budget'):pc(tPay,tOut)+' of spend')+
      kpi(net,'Total profit',CSS('--gold'),prof,0,(tIn?pc(net,tIn):'0%')+' margin')+
    '</div>'+

    section({title:'INCOME',short:'Income',color:CSS('--green'),rows:d.income,
      groupBy:'business',tableTitle:'Income by business',tableCol:'Business',
      byLabel:'business',budget:B.income,colorOf:bizColor})+

    section({title:'EXPENSES',short:'Expenses',color:CSS('--pink'),rows:d.expenses,
      groupBy:'category',tableTitle:'Expenses by category',tableCol:'Category',
      byLabel:'category',budget:B.expenses,split:'direct'})+

    section({title:'PAYROLL',short:'Payroll',color:CSS('--purple'),rows:d.payroll,
      groupBy:'worker',tableTitle:'Payroll by worker',tableCol:'Worker',
      byLabel:'worker',budget:B.payroll})+

    profitSection(d,inc,out,prof,tIn,tExp,tPay,net,bizColor)+

    expenseLog(d.expenses,bizColor)+

    '<div class="note" style="--c:var(--gold)">'+insight(d,tIn,tExp,tPay,net,out)+'</div>';
}

/* Full transaction log with receipt photos. Newest first. */
function expenseLog(rows,bizColor){
  const pink=CSS('--pink');
  const withPhoto=rows.filter(r=>photoUrl(r.photo)).length;
  const list=[...rows].sort((a,b)=>b.date-a.date).slice(0,250);
  const body=list.length?list.map(r=>
    '<tr>'+thumbCell(r)+
    '<td style="white-space:nowrap">'+r.date.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</td>'+
    '<td class="tname">'+esc(r.desc||r.category)+'</td>'+
    '<td class="tname" style="color:var(--mute)">'+esc(r.job||'\u2014')+'</td>'+
    '<td><span class="dot" style="background:'+bizColor(r.business)+'"></span>'+esc(r.business)+'</td>'+
    '<td style="color:var(--mute)">'+esc(r.category)+'</td>'+
    '<td class="n">'+money(r.amount)+'</td></tr>').join('')
    :'<tr><td class="empty" colspan="7">Nothing recorded</td></tr>';

  return '<section class="sec" style="--c:'+pink+'"><h2>EXPENSE LOG</h2>'+
    '<div class="card"><h3>Every expense, newest first &middot; '+
      withPhoto+' of '+rows.length+' have a receipt photo attached'+
      (list.length<rows.length?' &middot; showing the latest '+list.length:'')+
    '</h3>'+
    '<div class="scroll" style="max-height:520px"><table><thead><tr>'+
      '<th>Receipt</th><th>Date</th><th>What it was</th><th>Job</th>'+
      '<th>Business</th><th>Category</th><th class="n">Amount</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div></div></section>';
}

function profitSection(d,inc,out,prof,tIn,tExp,tPay,net,bizColor){
  const gold=CSS('--gold');
  const names=[...new Set(d.income.concat(d.expenses,d.payroll).map(r=>r.business))].filter(Boolean);
  const perBiz=names.map(n=>{
    const i=sum(d.income.filter(r=>r.business===n));
    const e=sum(d.expenses.filter(r=>r.business===n));
    const p=sum(d.payroll.filter(r=>r.business===n));
    return {n,i,e,p,k:i-e-p};
  }).sort((a,b)=>b.k-a.k);

  let run=0; const cum=prof.map(v=>run+=v);
  const best=prof.indexOf(Math.max(...prof)), worst=prof.indexOf(Math.min(...prof));
  const posPairs=perBiz.filter(b=>b.k>0).map(b=>[b.n,b.k]);

  return '<section class="sec" style="--c:'+gold+'"><h2>PROFIT</h2>'+
  '<div class="rowA">'+
    '<div class="card"><h3>Profit by business</h3><div class="scroll"><table><thead><tr>'+
      '<th>Business</th><th class="n">In</th><th class="n">Out</th><th class="n">Kept</th><th class="n">Margin</th>'+
      '</tr></thead><tbody>'+(perBiz.length?perBiz.map(b=>
      '<tr><td class="tname"><span class="dot" style="background:'+bizColor(b.n)+'"></span>'+esc(b.n)+'</td>'+
      '<td class="n">'+compact(b.i)+'</td><td class="n">'+compact(b.e+b.p)+'</td>'+
      '<td class="n" style="color:'+(b.k>=0?gold:CSS('--pink'))+'">'+compact(b.k)+'</td>'+
      '<td class="n" style="color:var(--mute)">'+(b.i?pc(b.k,b.i):'—')+'</td></tr>').join('')
      :'<tr><td class="empty" colspan="5">No data</td></tr>')+'</tbody></table></div></div>'+

    '<div class="card ov"><h3>Annual profit overview</h3>'+
      '<div class="ovtop"><div>Money in<b>'+compact(tIn)+'</b></div>'+
      '<div style="text-align:right">Money out<b>'+compact(tExp+tPay)+'</b></div></div>'+
      pbar(tIn?Math.max(0,net)/tIn:0,gold)+
      '<div style="font-size:10.5px;color:var(--mute);margin-top:4px">'+(tIn?pc(net,tIn):'0%')+' kept</div>'+
      '<div class="ovbig"><div class="n">'+money(net)+'</div>'+
      '<div class="t">kept this year after materials, overhead and payroll</div></div></div>'+

    '<div class="card"><h3>Profit by month</h3>'+
      chColumns(prof,M,gold,null,{h:252})+'</div>'+

    '<div class="card"><h3>Where every dollar went</h3>'+
      '<div class="split"><div>Kept<b style="color:'+gold+'">'+compact(net)+'</b></div>'+
      '<div style="text-align:right">Spent<b>'+compact(tExp+tPay)+'</b></div></div>'+
      '<div class="gauges">'+
        '<div>'+gauge(tIn?tExp/tIn:0,CSS('--pink'))+'<small>Expenses</small></div>'+
        '<div>'+gauge(tIn?tPay/tIn:0,CSS('--purple'))+'<small>Payroll</small></div></div>'+
      '<div style="margin-top:10px">'+chMini(prof.map(v=>Math.max(0,v)),gold)+'</div></div>'+
  '</div>'+

  '<div class="rowB">'+
    '<div class="card"><h3>Profit building up through the year</h3>'+chCombo(cum,M,gold,null)+'</div>'+
    '<div class="card"><h3>Profit share by business</h3>'+
      (posPairs.length?chDonut(posPairs,bizColor,292):'<div class="empty">No business is profitable yet</div>')+'</div>'+
    '<div class="card">'+
      '<div class="stat"><div class="k">Average monthly profit</div><div class="r"><span>Per month</span><b style="color:'+gold+'">'+money(net/12)+'</b></div></div>'+
      '<div class="stat"><div class="k">Best month</div><div class="r"><span>'+M[best]+'</span><b style="color:'+gold+'">'+money(prof[best])+'</b></div></div>'+
      '<div class="stat"><div class="k">Worst month</div><div class="r"><span>'+M[worst]+'</span><b style="color:'+(prof[worst]<0?CSS('--pink'):CSS('--ink'))+'">'+money(prof[worst])+'</b></div></div>'+
      '<div class="stat"><div class="k">Months in the red</div><div class="r"><span>out of 12</span><b>'+prof.filter(v=>v<0).length+'</b></div></div>'+
      '<div class="stat"><div class="k">Kept per $100 earned</div><div class="r"><span>margin</span><b style="color:'+gold+'">'+(tIn?money(net/tIn*100):'—')+'</b></div></div>'+
    '</div>'+
  '</div></section>';
}

function insight(d,tIn,tExp,tPay,net,out){
  const cats=group(d.expenses,'category');
  const worst=out.indexOf(Math.max(...out));
  if(!cats.length) return 'No expenses recorded for this filter yet.';
  const direct=sum(d.expenses.filter(r=>isDirect(r.category)));
  return 'Largest cost line is '+cats[0][0]+' at '+money(cats[0][1])+', which is '+
    pc(cats[0][1],tExp+tPay)+' of everything spent. Payroll takes '+pc(tPay,tExp+tPay)+
    ' and direct job cost is '+pc(direct,tExp)+' of expenses, so overhead is '+
    pc(tExp-direct,tExp)+'. Heaviest spending month was '+M[worst]+' at '+money(out[worst])+
    '. The year kept '+pc(net,tIn)+' of everything earned.';
}

/* ======================= personal view ======================= */
function renderPer(){
  const rows=DATA.expenses.filter(r=>inY(r)&&r.business==='Personal');
  const m=perMonth(rows), total=sum(rows);
  const live=m.filter(v=>v>0).length||1;
  const avg=total/live, hi=m.indexOf(Math.max(...m));
  const cats=group(rows,'category');
  const pal=['#F4C542','#FF4D6D','#3FDD9C','#7C6CF6','#4FC3F7','#FF9E57','#E879F9','#5EEAD4','#A3E635','#FCA5A5','#93C5FD','#C4B5FD'];
  const cc=n=>pal[Math.max(0,cats.findIndex(c=>c[0]===n))%pal.length];
  const gold=CSS('--gold');
  const h1=m.slice(0,6).reduce((a,b)=>a+b,0), h2=m.slice(6).reduce((a,b)=>a+b,0);

  const kpi=(v,l,color,series,note)=>
    '<div class="kpi"><div class="v" style="color:'+color+'">'+v+'</div><div class="l">'+l+'</div>'+
    pbar(1,color)+'<div class="meta"><span></span><span>'+note+'</span></div>'+
    '<div class="spark">'+chSpark(series,color)+'</div></div>';

  const matrix=cats.slice(0,10).map(([n])=>{
    const mm=perMonth(rows.filter(r=>r.category===n)), peak=Math.max(...mm);
    return '<tr><td class="tname">'+esc(n)+'</td>'+mm.map(v=>'<td class="n" style="color:'+
      (v===peak&&v>0?gold:(v?'var(--ink)':'var(--faint)'))+'">'+(v?compact(v):'·')+'</td>').join('')+
      '<td class="n" style="font-weight:600">'+compact(mm.reduce((a,b)=>a+b,0))+'</td></tr>';
  }).join('');

  $('viewPer').innerHTML=
    '<div class="hero">'+
      '<div class="titlecard"><h1>Personal<br>Dashboard<small>'+year+' · kept separate from the businesses</small></h1></div>'+
      kpi(money(total),'Spent this year',gold,m,rows.length+' entries')+
      kpi(money(avg),'Average month',CSS('--green'),m.map(v=>v-avg),m.filter(v=>v>avg).length+' months above')+
      kpi(money(m[hi]),'Heaviest month',CSS('--pink'),m,M[hi]+' · '+(avg?Math.round((m[hi]/avg-1)*100)+'% above':''))+
      kpi(cats.length?cats[0][0]:'—','Biggest class',CSS('--purple'),
        cats.length?perMonth(rows.filter(r=>r.category===cats[0][0])):m,
        cats.length?pc(cats[0][1],total)+' of spending':'')+
    '</div>'+

    section({title:'SPENDING BY CLASS',short:'Spending',color:gold,rows:rows,
      groupBy:'category',tableTitle:'Every class, largest first',tableCol:'Class',
      byLabel:'class',budget:0,colorOf:cc})+

    '<section class="sec" style="--c:'+gold+'"><h2>PATTERNS</h2><div class="rowB">'+
      '<div class="card"><h3>Month by month, by class</h3><div class="scroll"><table><thead><tr><th>Class</th>'+
        M.map(x=>'<th class="n">'+x+'</th>').join('')+'<th class="n">Total</th></tr></thead><tbody>'+
        (matrix||'<tr><td class="empty" colspan="14">Nothing recorded</td></tr>')+'</tbody></table></div></div>'+
      '<div class="card"><h3>Biggest single expenses</h3><div class="scroll"><table><thead><tr>'+
        '<th>Receipt</th><th>Date</th><th>What it was</th><th>Class</th><th class="n">Amount</th></tr></thead><tbody>'+
        ([...rows].sort((a,b)=>b.amount-a.amount).slice(0,22).map(r=>
          '<tr>'+thumbCell(r)+'<td>'+r.date.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</td>'+
          '<td class="tname">'+esc(r.desc||r.category)+'</td>'+
          '<td style="color:var(--mute)">'+esc(r.category)+'</td>'+
          '<td class="n">'+money(r.amount)+'</td></tr>').join('')||
          '<tr><td class="empty" colspan="5">Nothing recorded</td></tr>')+'</tbody></table></div></div>'+
      '<div class="card">'+
        '<div class="stat"><div class="k">First half of year</div><div class="r"><span>Jan to Jun</span><b>'+money(h1)+'</b></div></div>'+
        '<div class="stat"><div class="k">Second half of year</div><div class="r"><span>Jul to Dec</span><b>'+money(h2)+'</b></div></div>'+
        '<div class="stat"><div class="k">Top four classes together</div><div class="r"><span>of all spending</span><b style="color:'+gold+'">'+
          pc(cats.slice(0,4).reduce((t,c)=>t+c[1],0),total)+'</b></div></div>'+
        '<div class="stat"><div class="k">Classes tracked</div><div class="r"><span>'+rows.length+' entries</span><b>'+cats.length+'</b></div></div>'+
        '<div class="stat"><div class="k">Largest single expense</div><div class="r"><span>one entry</span><b>'+
          (rows.length?money(Math.max(...rows.map(r=>r.amount))):'—')+'</b></div></div>'+
      '</div>'+
    '</div></section>'+

    '<div class="note" style="--c:'+gold+'">'+(cats.length
      ? cats[0][0]+' takes '+pc(cats[0][1],total)+' of personal spending. The top four classes together are '+
        pc(cats.slice(0,4).reduce((t,c)=>t+c[1],0),total)+'. '+M[hi]+' was the heaviest month at '+money(m[hi])+
        ', which is '+(avg?Math.round((m[hi]/avg-1)*100):0)+'% above a normal month.'
      : 'No personal expenses recorded for '+year+'.')+'</div>';
}

/* ======================= shell ======================= */
function show(which){
  const b=which==='biz';
  $('viewBiz').classList.toggle('hide',!b);
  $('viewPer').classList.toggle('hide',b);
  $('tabBiz').setAttribute('aria-selected',b);
  $('tabPer').setAttribute('aria-selected',!b);
  $('selBiz').style.visibility=b?'visible':'hidden';
  (b?renderBiz:renderPer)();
  window.scrollTo({top:0,behavior:'instant'});
}
function controls(){
  const ys=[...new Set(DATA.income.concat(DATA.expenses,DATA.payroll)
    .filter(r=>r.date).map(r=>r.date.getFullYear()))].sort((a,b)=>b-a);
  if(!ys.length) ys.push(new Date().getFullYear());
  year=ys[0];
  $('selYear').innerHTML=ys.map(y=>'<option>'+y+'</option>').join('');
  const ns=[...new Set(DATA.income.concat(DATA.expenses,DATA.payroll).map(r=>r.business))]
    .filter(n=>n&&n!=='Personal').sort();
  $('selBiz').innerHTML=['All businesses',...ns].map(n=>
    '<option value="'+(n==='All businesses'?'All':esc(n))+'">'+esc(n)+'</option>').join('');
  $('selYear').onchange=e=>{year=+e.target.value;redraw();};
  $('selBiz').onchange =e=>{bizF=e.target.value;redraw();};
  $('tabBiz').onclick=()=>show('biz');
  $('tabPer').onclick=()=>show('per');
}
const redraw=()=>show($('tabBiz').getAttribute('aria-selected')==='true'?'biz':'per');

(async function boot(){
  if(CONFIG.MODE==='csv'){
    try{
      const [i,f,c,s,p,pf,pc2]=await Promise.all(['incomeJobs','expFlower','expConcrete',
        'expSts','expPersonal','payFlower','payConcrete'].map(loadSrc));
      DATA={income:i,expenses:[...f,...c,...s,...p],payroll:[...pf,...pc2]};
    }catch(err){
      document.body.insertAdjacentHTML('afterbegin','<div class="wrap"><div class="note" '+
        'style="--c:var(--pink);background:rgba(255,77,109,.08);margin-top:14px">'+esc(err.message)+
        ' Showing sample data instead. Usual causes: the sheet is no longer shared as '+
        '\u201cAnyone with the link can view\u201d, a tab was renamed, or this file was opened '+
        'straight from disk instead of over https.</div></div>');
      DATA=demo();
    }
  } else DATA=demo();
  controls();
  show('biz');
})();

})();
</script>
